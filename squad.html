<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squad Creator — Gloucester Chess Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --felt:#123524; --felt-2:#0d2a1b; --ivory:#F1ECDF; --ivory-dim:#c9c2ab;
  --gold:#C9A24B; --line:#2a4c39;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{margin:0; min-height:100%; background:var(--felt); color:var(--ivory); font-family:'IBM Plex Mono', monospace; font-size:14px;}
.wrap{max-width:820px; margin:0 auto; padding:32px 20px 64px;}
header{margin-bottom:20px; border-bottom:1px solid var(--line); padding-bottom:18px;}
a.back{color:var(--gold); text-decoration:none; font-size:12px;}
h1{font-family:'Fraunces', serif; font-weight:700; font-size:clamp(24px,5vw,34px); margin:10px 0 6px;}
.sub{color:var(--ivory-dim); font-size:13px; max-width:60ch; line-height:1.5;}

.row{display:flex; flex-wrap:wrap; gap:10px; margin:18px 0;}
select, input[type=text], input[type=date]{
  background:var(--felt-2); border:1px solid var(--line); color:var(--ivory);
  font-family:inherit; font-size:13px; padding:9px 10px; border-radius:2px;
}
select:focus, input:focus{outline:1px solid var(--gold);}
label{font-size:11px; color:var(--ivory-dim); display:block; margin-bottom:4px;}
.field{display:flex; flex-direction:column;}

.captain-banner{
  display:none; margin:18px 0; padding:12px 16px; background:var(--felt-2);
  border-left:3px solid var(--gold); font-size:13px;
}
.captain-banner b{color:var(--gold);}

.cols{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:24px;}
@media (max-width:640px){ .cols{grid-template-columns:1fr;} }
h2{font-family:'Fraunces',serif; font-weight:700; font-size:16px; margin:0 0 10px; color:var(--ivory-dim);}
.list{border:1px solid var(--line); min-height:120px;}
.player-row{
  display:flex; justify-content:space-between; align-items:center; padding:9px 12px;
  border-bottom:1px solid rgba(42,76,57,0.6); cursor:pointer; font-size:13px;
}
.player-row:last-child{border-bottom:none;}
.player-row:hover{background:rgba(201,162,75,0.08);}
.player-row .rtg{color:var(--ivory-dim); font-size:11.5px;}
.player-row .cap{color:var(--gold); font-weight:600;}
.empty{padding:14px 12px; color:var(--ivory-dim); font-size:12px;}
.squad-row{display:flex; align-items:center; gap:8px;}
.squad-row .num{color:var(--ivory-dim); width:18px; flex-shrink:0;}
.squad-row .btns{display:flex; gap:4px; margin-left:auto;}
.squad-row button{background:none; border:1px solid var(--line); color:var(--ivory-dim); font-size:11px; padding:2px 6px; cursor:pointer; border-radius:2px;}
.squad-row button:hover{color:var(--gold); border-color:var(--gold);}

.export-row{display:flex; gap:10px; margin-top:26px; flex-wrap:wrap;}
.export-row button{
  background:var(--gold); color:var(--felt); border:none; font-family:inherit; font-weight:600;
  font-size:13px; padding:10px 16px; border-radius:2px; cursor:pointer;
}
.export-row button.secondary{background:none; border:1px solid var(--gold); color:var(--gold);}
.export-row button:disabled{opacity:0.4; cursor:not-allowed;}
.copied{font-size:12px; color:var(--gold); margin-left:8px; display:none;}

/* the exportable sheet */
#sheet{
  margin-top:30px; background:var(--felt-2); border:1px solid var(--line); padding:26px 28px;
  max-width:480px;
}
#sheet .sheetTitle{font-family:'Fraunces',serif; font-weight:700; font-size:20px; color:var(--gold);}
#sheet .sheetMeta{font-size:12px; color:var(--ivory-dim); margin:4px 0 16px;}
#sheet ol{margin:0; padding-left:22px;}
#sheet li{padding:5px 0; font-size:14px; border-bottom:1px solid rgba(42,76,57,0.5);}
#sheet li:last-child{border-bottom:none;}
#sheet .capTag{color:var(--gold); font-weight:600;}
.loading, .error{color:var(--ivory-dim); padding:16px 0;}
.error{color:#a85c4f;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="back" href="index.html">&larr; Back to tracker</a>
  <h1>Squad Creator</h1>
  <div class="sub">Pick a team, build the squad from eligible players, and export a team sheet. Nothing here is saved anywhere — export before you close the tab.</div>
</header>

<div id="loadState" class="loading">Loading roster…</div>

<div id="app" style="display:none">
  <div class="row">
    <div class="field">
      <label for="teamSelect">Team</label>
      <select id="teamSelect"><option value="">Choose a team…</option></select>
    </div>
    <div class="field">
      <label for="oppInput">Opponent (optional)</label>
      <input type="text" id="oppInput" placeholder="e.g. Cirencester">
    </div>
    <div class="field">
      <label for="dateInput">Match date (optional)</label>
      <input type="date" id="dateInput">
    </div>
  </div>

  <div class="captain-banner" id="captainBanner"></div>

  <div class="cols">
    <div>
      <h2>Available players</h2>
      <div class="list" id="poolList"></div>
    </div>
    <div>
      <h2>Squad <span id="squadCount" style="color:var(--ivory-dim); font-weight:normal;"></span></h2>
      <div class="list" id="squadList"></div>
    </div>
  </div>

  <div class="export-row">
    <button id="copyBtn">Copy as text</button>
    <button id="imgBtn">Download image</button>
    <span class="copied" id="copiedMsg">Copied ✓</span>
  </div>

  <div id="sheet"></div>
</div>
</div>

<script>
let FACT = [], RATINGS = {};
let squad = []; // array of ecf_code, in order
let currentTeam = "";

async function loadData(){
  const loadState = document.getElementById('loadState');
  try{
    const fact = await fetch('data/fact_table.json').then(r=>r.ok?r.json():Promise.reject(r.status));
    FACT = fact;
    // Ratings are optional -- roster.json may use a different schema, so fail soft.
    try{
      const roster = await fetch('data/roster.json').then(r=>r.ok?r.json():[]);
      roster.forEach(p=>{
        const code = p.ecf_code;
        if(code) RATINGS[code] = p.std || p.rapid || null;
      });
    }catch(e){ /* ratings are a nice-to-have, not required */ }

    loadState.style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initTeams();
  }catch(err){
    loadState.textContent = 'Could not load data/fact_table.json. Expected format: [{ "ecf_code": "...", "name": "...", "teams": [{ "name": "Gloucester Gargoyles", "role": "captain" }] }, ...]. If you just opened this file directly, run it via a local server or GitHub Pages -- browsers block fetch() on file:// URLs.';
    loadState.className = 'error';
    console.error(err);
  }
}

function allTeamNames(){
  const s = new Set();
  FACT.forEach(p => (p.teams||[]).forEach(t => s.add(t.name)));
  return [...s].sort();
}

function initTeams(){
  const sel = document.getElementById('teamSelect');
  allTeamNames().forEach(t=>{
    const o = document.createElement('option'); o.value = t; o.textContent = t; sel.appendChild(o);
  });
  sel.addEventListener('change', ()=>{ currentTeam = sel.value; squad = []; render(); });
  document.getElementById('oppInput').addEventListener('input', renderSheet);
  document.getElementById('dateInput').addEventListener('input', renderSheet);
  document.getElementById('copyBtn').addEventListener('click', copyText);
  document.getElementById('imgBtn').addEventListener('click', downloadImage);
}

function playersForTeam(team){
  return FACT.filter(p => (p.teams||[]).some(t => t.name === team));
}
function captainsForTeam(team){
  return FACT.filter(p => (p.teams||[]).some(t => t.name === team && t.role === 'captain'));
}
function isCaptain(p, team){
  return (p.teams||[]).some(t => t.name === team && t.role === 'captain');
}

function render(){
  const banner = document.getElementById('captainBanner');
  if(!currentTeam){
    banner.style.display = 'none';
    document.getElementById('poolList').innerHTML = '';
    document.getElementById('squadList').innerHTML = '';
    renderSheet();
    return;
  }
  const caps = captainsForTeam(currentTeam);
  banner.style.display = 'block';
  banner.innerHTML = caps.length
    ? `<b>${currentTeam}</b> — Captain${caps.length>1?'s':''}: ${caps.map(c=>c.name).join(', ')}`
    : `<b>${currentTeam}</b> — no captain recorded in the fact table.`;

  const pool = playersForTeam(currentTeam).filter(p => !squad.includes(p.ecf_code));
  const poolEl = document.getElementById('poolList');
  poolEl.innerHTML = pool.length ? pool.map(p=>rowHtml(p)).join('') :
    `<div class="empty">No more eligible players to add.</div>`;
  poolEl.querySelectorAll('.player-row').forEach(el=>{
    el.addEventListener('click', ()=>{ squad.push(el.dataset.code); render(); });
  });

  const squadEl = document.getElementById('squadList');
  document.getElementById('squadCount').textContent = squad.length ? `(${squad.length})` : '';
  squadEl.innerHTML = squad.length ? squad.map((code,i)=>{
    const p = FACT.find(x=>x.ecf_code===code);
    return `<div class="player-row squad-row" data-code="${code}">
      <span class="num">${i+1}.</span>
      <span>${p ? p.name : code}${isCaptain(p, currentTeam) ? ' <span class="cap">(C)</span>' : ''}</span>
      <span class="rtg">${RATINGS[code] || ''}</span>
      <span class="btns">
        <button data-act="up" ${i===0?'disabled':''}>↑</button>
        <button data-act="down" ${i===squad.length-1?'disabled':''}>↓</button>
        <button data-act="remove">✕</button>
      </span>
    </div>`;
  }).join('') : `<div class="empty">Click players on the left to add them.</div>`;

  squadEl.querySelectorAll('.squad-row button').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const row = btn.closest('.squad-row');
      const idx = squad.indexOf(row.dataset.code);
      if(btn.dataset.act === 'remove') squad.splice(idx,1);
      if(btn.dataset.act === 'up' && idx>0) [squad[idx-1],squad[idx]]=[squad[idx],squad[idx-1]];
      if(btn.dataset.act === 'down' && idx<squad.length-1) [squad[idx+1],squad[idx]]=[squad[idx],squad[idx+1]];
      render();
    });
  });

  renderSheet();
}

function rowHtml(p){
  const rtg = RATINGS[p.ecf_code] ? `<span class="rtg">${RATINGS[p.ecf_code]}</span>` : '';
  const capTag = isCaptain(p, currentTeam) ? ' <span class="cap">(C)</span>' : '';
  return `<div class="player-row" data-code="${p.ecf_code}"><span>${p.name}${capTag}</span>${rtg}</div>`;
}

function renderSheet(){
  const sheet = document.getElementById('sheet');
  const opp = document.getElementById('oppInput').value.trim();
  const date = document.getElementById('dateInput').value;
  const dateFmt = date ? new Date(date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '';
  const metaParts = [opp ? `vs ${opp}` : null, dateFmt || null].filter(Boolean);

  if(!currentTeam || squad.length===0){
    sheet.innerHTML = '';
    document.getElementById('copyBtn').disabled = true;
    document.getElementById('imgBtn').disabled = true;
    return;
  }
  document.getElementById('copyBtn').disabled = false;
  document.getElementById('imgBtn').disabled = false;

  const items = squad.map(code=>{
    const p = FACT.find(x=>x.ecf_code===code);
    const name = p ? p.name : code;
    const cap = isCaptain(p, currentTeam);
    return `<li>${name}${cap ? ' <span class="capTag">(C)</span>' : ''}</li>`;
  }).join('');

  sheet.innerHTML = `
    <div class="sheetTitle">${currentTeam}</div>
    <div class="sheetMeta">${metaParts.length ? metaParts.join(' — ') : 'Squad'}</div>
    <ol>${items}</ol>`;
}

function copyText(){
  const opp = document.getElementById('oppInput').value.trim();
  const date = document.getElementById('dateInput').value;
  const dateFmt = date ? new Date(date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '';
  const lines = [currentTeam];
  const metaParts = [opp ? `vs ${opp}` : null, dateFmt || null].filter(Boolean);
  if(metaParts.length) lines.push(metaParts.join(' — '));
  lines.push('');
  squad.forEach((code,i)=>{
    const p = FACT.find(x=>x.ecf_code===code);
    const name = p ? p.name : code;
    lines.push(`${i+1}. ${name}${isCaptain(p, currentTeam) ? ' (C)' : ''}`);
  });
  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(()=>{
    const msg = document.getElementById('copiedMsg');
    msg.style.display = 'inline';
    setTimeout(()=>msg.style.display='none', 1800);
  }).catch(()=>{
    alert(text); // fallback if clipboard API is blocked
  });
}

function downloadImage(){
  const sheet = document.getElementById('sheet');
  html2canvas(sheet, {backgroundColor: '#0d2a1b', scale: 2}).then(canvas=>{
    const link = document.createElement('a');
    const safeTeam = currentTeam.replace(/[^a-z0-9]+/gi,'-').toLowerCase();
    link.download = `${safeTeam}-squad.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

loadData();
</script>
</body>
</html>
